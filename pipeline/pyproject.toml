[project]
name = "laefon-pipeline"
version = "0.1.0"
description = "แลฝน pipeline: ข้อมูลเรดาร์ → ทำนาย → ไฟล์ผลลัพธ์ให้ backend (ตอนนี้มีแค่ mock generator)"
requires-python = ">=3.12"
dependencies = [
    "contourpy>=1.4.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laefon_pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
