# pipeline -> api -> web -> nginx
#   cp .env.example .env && docker compose up -d --build
# Regenerate mock data: docker compose run --rm pipeline

name: laefon

services:
  # One-shot mock generator for now; will run every 15 min on real radar data.
  pipeline:
    build: ./pipeline
    image: laefon/pipeline:local
    volumes:
      - laefon-data:/data
    restart: "no"

  api:
    build: ./backend
    image: laefon/api:local
    depends_on:
      pipeline:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DATA_DIR: /data
      MOCK_LIVE_CLOCK: ${MOCK_LIVE_CLOCK:-true}
    volumes:
      - laefon-data:/data:ro
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    image: laefon/web:local
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:9000
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      web:
        condition: service_healthy
    # Same as tent: only nginx is published, localhost by default.
    ports:
      - "${NGINX_HOST:-127.0.0.1}:${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  laefon-data:
