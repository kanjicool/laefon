server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Read-only public API for other systems. The web app itself uses the SvelteKit BFF.
    location /public-api/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://api:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Radar images: serve from FastAPI directly, skipping Node.
    location /api/v1/files/ {
        proxy_pass http://api:9000/v1/files/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
